services:
  invidious:
    image: quay.io/invidious/invidious:latest
    container_name: invidious
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: invidious
          password: ${INVIDIOUS_DB_PASSWORD:?Set INVIDIOUS_DB_PASSWORD in .env}
          host: invidious-db
          port: 5432
        check_tables: true
        invidious_companion:
          - private_url: "http://companion:8282/companion"
        invidious_companion_key: ${INVIDIOUS_COMPANION_KEY:?Set INVIDIOUS_COMPANION_KEY in .env}
        hmac_key: ${INVIDIOUS_HMAC_KEY:?Set INVIDIOUS_HMAC_KEY in .env}
        captcha_enabled: false
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/stats || exit 1
      interval: 30s
      timeout: 5s
      retries: 2
    logging:
      options:
        max-size: 1G
        max-file: "4"
    depends_on:
      - invidious-db
    restart: unless-stopped

  companion:
    image: quay.io/invidious/invidious-companion:latest
    environment:
      SERVER_SECRET_KEY: ${INVIDIOUS_COMPANION_KEY:?Set INVIDIOUS_COMPANION_KEY in .env}
    volumes:
      - ${INVIDIOUS_DATA_DIR:?Set INVIDIOUS_DATA_DIR in .env}/companion-cache:/var/tmp/youtubei.js:rw
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 1G
        max-file: "4"
    restart: unless-stopped

  invidious-db:
    image: docker.io/library/postgres:14
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: invidious
      POSTGRES_PASSWORD: ${INVIDIOUS_DB_PASSWORD:?Set INVIDIOUS_DB_PASSWORD in .env}
    volumes:
      - ${INVIDIOUS_DATA_DIR:?Set INVIDIOUS_DATA_DIR in .env}/postgres:/var/lib/postgresql/data
      - ${INVIDIOUS_SOURCE_DIR:?Set INVIDIOUS_SOURCE_DIR in .env}/config/sql:/config/sql:ro
      - ${INVIDIOUS_SOURCE_DIR:?Set INVIDIOUS_SOURCE_DIR in .env}/docker/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    restart: unless-stopped
